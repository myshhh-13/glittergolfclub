<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
		<title>{% block title %}{% endblock %}</title>
		{% if env == "prod" %}
			<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
			<script src="{{ url_for('static', filename='js/script.js') }}"></script>
		{% elif env == "dev" %}
			<link rel="stylesheet" href="{{ url_for('static', filename='dev/css/style.css') }}">
			<script src="{{ url_for('static', filename='dev/js/script.js') }}"></script>
		{% endif %}
	</head>
	<body>
		<header>
			<a>hi</a>
		</header>
		<main>
			{% block content %}{% endblock %}
		</main>
		<footer>
			<h2> Версия {{ env }} {{ version }} </h2>
		</footer>
	</body>
</html>
